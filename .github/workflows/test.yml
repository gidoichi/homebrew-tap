name: Test
on: push
jobs:
  brew-install:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@15d0b666bf0311bfe676c178e0824dc1b52074a7 # main
      - name: brew install
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          # workaround: to use bubblewrap by homebrew
          HOMEBREW_NO_SANDBOX_LINUX: "1"
        run: |
          set -eux
          brew trust "${GITHUB_REPOSITORY}"
          for pkg in $(ls $(brew --repository gidoichi/tap)/Formula | sed 's/\.rb$//'); do
            brew install --build-from-source --verbose "${GITHUB_REPOSITORY}/${pkg}"
          done

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: github
      - run: terraform plan -detailed-exitcode
        working-directory: github
        env:
          TF_VAR_GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_TERRAFORM_PLAN }}
