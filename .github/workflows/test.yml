name: Test
on: push
jobs:
  brew-install:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@841d750a0ed9262d3c3ca31f2173974696bc261a # main
      - name: brew install
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          # workaround: to use bubblewrap by homebrew
          HOMEBREW_NO_SANDBOX_LINUX: "1"
        run: |
          set -eux
          brew trust "${GITHUB_REPOSITORY}"
          for pkg in $(ls $(brew --repository gidoichi/tap)/Formula | sed 's/\.rb$//'); do
            brew install --build-from-source --verbose "${GITHUB_REPOSITORY}/${pkg}"
          done

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: github
      - run: terraform plan -detailed-exitcode
        working-directory: github
        env:
          TF_VAR_GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_TERRAFORM_PLAN }}
